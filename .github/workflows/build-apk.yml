name: Build Android APK (Claude Sync)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Prepare Android Project
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ClaudeSync-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-sync-apk
          path: ClaudeSync-debug.apk

      - name: Publish Direct APK Download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "Claude Sync Android APK (Latest Auto-Build)"
          body: "Готовый установочный файл **ClaudeSync-debug.apk** скомпилирован автоматически через GitHub Actions."
          files: ClaudeSync-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
